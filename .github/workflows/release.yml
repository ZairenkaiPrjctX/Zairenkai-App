name: Release

# Manual only, from dev. Checks every secret, the module key against the trust list and the
# keystore before building; builds the integrated app exactly as CI's full integration job, signs
# the module catalog and the APK with keys held in the "release" environment, verifies the APK with
# apksigner and runs the release gate (verify_integration.py report --release). Nothing is
# published: the signed APK is only a workflow artifact, uploaded when every check passed. The
# gate fails while any prerequisite is missing: signing keys, a trusted module-signing key in
# integration/module-trust.json, or a licence for every distributed component. No signing key is
# ever written to the workspace outside $RUNNER_TEMP, printed, or uploaded.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: r27d
  NDK_SHA256: 601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9

jobs:
  release:
    name: signed release build and release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the source lock
        run: python3 integration/scripts/verify_integration.py lock
      - name: Require the dev branch and every release secret
        env:
          REF: ${{ github.ref }}
          APP_ID: ${{ vars.ZAIRENKAI_CI_APP_ID }}
          HAS_ZAIRENKAI_CI_APP_PRIVATE_KEY: ${{ secrets.ZAIRENKAI_CI_APP_PRIVATE_KEY != '' }}
          HAS_ZAIRENKAI_MODULE_SIGNING_KEY: ${{ secrets.ZAIRENKAI_MODULE_SIGNING_KEY != '' }}
          HAS_ZAIRENKAI_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZAIRENKAI_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD != '' }}
          HAS_ZAIRENKAI_RELEASE_KEY_ALIAS: ${{ secrets.ZAIRENKAI_RELEASE_KEY_ALIAS != '' }}
          HAS_ZAIRENKAI_RELEASE_KEY_PASSWORD: ${{ secrets.ZAIRENKAI_RELEASE_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [ "$REF" = refs/heads/dev ] || missing="$missing branch-dev(ran-on-$REF)"
          [[ $APP_ID =~ ^[0-9]+$ ]] || missing="$missing ZAIRENKAI_CI_APP_ID(variable,numeric)"
          for name in ZAIRENKAI_CI_APP_PRIVATE_KEY ZAIRENKAI_MODULE_SIGNING_KEY ZAIRENKAI_RELEASE_KEYSTORE_BASE64 \
            ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD ZAIRENKAI_RELEASE_KEY_ALIAS ZAIRENKAI_RELEASE_KEY_PASSWORD; do
            has="HAS_$name"
            [ "${!has}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Release blocked before the build: missing$missing (docs/build/secrets-and-variables.md)."
            echo "Release blocked before the build. Missing:$missing. Run integration/scripts/setup-actions-secrets.sh status." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Write the signing keys to the runner's temporary directory and check them
        env:
          MODULE_KEY: ${{ secrets.ZAIRENKAI_MODULE_SIGNING_KEY }}
          KEYSTORE: ${{ secrets.ZAIRENKAI_RELEASE_KEYSTORE_BASE64 }}
          ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD }}
          ZAIRENKAI_RELEASE_KEY_ALIAS: ${{ secrets.ZAIRENKAI_RELEASE_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s\n' "$MODULE_KEY" > "$RUNNER_TEMP/module-signing.pem"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZAIRENKAI_MODULE_SIGNING_KEY_FILE=$RUNNER_TEMP/module-signing.pem" >> "$GITHUB_ENV"
          echo "ZAIRENKAI_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Fail now, not after the build: the module key must be in the committed trust list and
          # the keystore must open with the stored alias and password. Only public data is shown.
          key_id=$(openssl pkey -in "$RUNNER_TEMP/module-signing.pem" -pubout -outform DER | sha256sum | cut -d' ' -f1)
          if ! python3 -c 'import json,sys; sys.exit(sys.argv[1] not in {k["key_id"] for k in json.load(open("integration/module-trust.json"))["keys"]})' "$key_id"; then
            echo "::error::ZAIRENKAI_MODULE_SIGNING_KEY (key ${key_id:0:16}) is not in integration/module-trust.json on this commit."
            exit 1
          fi
          if ! "$JAVA_HOME_17_X64/bin/keytool" -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD -alias "$ZAIRENKAI_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The release keystore does not open with ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD and ZAIRENKAI_RELEASE_KEY_ALIAS."
            exit 1
          fi
          echo "module-signing key ${key_id:0:16}… is trusted; the release keystore opens."
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ZAIRENKAI_CI_APP_ID }} # the numeric App ID, not the OAuth Client ID (v3.3.0 marks app-id deprecated but still reads it)
          private-key: ${{ secrets.ZAIRENKAI_CI_APP_PRIVATE_KEY }}
          owner: ZairenkaiPrjctX
          repositories: Zairenkai-Core,Zairenkai-FAS,Zairenkai-ART,Zairenkai-ThermalTools,Zairenkai-Database-Source
          permission-contents: read
      - name: Let git use the token
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --global "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"
      - name: Rust, Android targets and NDK (checksum verified)
        run: |
          rustup toolchain install stable --profile minimal -t aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustup default stable
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "${NDK_SHA256}  /tmp/ndk.zip" | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build every component and sign the module catalog
        run: integration/scripts/build-components.sh
      - run: python3 integration/scripts/verify_integration.py build
      - name: Tests, lint, signed release APK
        env:
          ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ZAIRENKAI_RELEASE_KEYSTORE_PASSWORD }}
          ZAIRENKAI_RELEASE_KEY_ALIAS: ${{ secrets.ZAIRENKAI_RELEASE_KEY_ALIAS }}
          ZAIRENKAI_RELEASE_KEY_PASSWORD: ${{ secrets.ZAIRENKAI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :integration-core:test :app:testDebugUnitTest lint assembleRelease
      - name: Remove keys and token
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/module-signing.pem" "$RUNNER_TEMP/release.jks"
          git config --global --unset-all "http.https://github.com/.extraheader" || true
      - name: Verify the APK signature with apksigner
        run: |
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          if ! "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt" 2>&1; then
            cat "$RUNNER_TEMP/apksigner.txt"
            echo "::error::apksigner rejected $apk: it is unsigned or its signature is invalid."
            exit 1
          fi
          { echo "### APK signature (apksigner)"; echo '```'
            grep -E '^Verified using|certificate (DN|SHA-256 digest)' "$RUNNER_TEMP/apksigner.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Release gate
        run: |
          python3 integration/scripts/verify_integration.py report app/build/outputs/apk/release/app-release.apk --release
          cat integration/out/integration-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            app/build/outputs/apk/release/app-release.apk
            integration/out/integration-report.json
            integration/out/integration-report.md
          if-no-files-found: error
      - name: Explain the failure
        if: failure()
        run: |
          { echo "## Release failed: nothing was published"
            echo "The step marked failed above holds the reason. Keys and the token were removed."
            echo "Check the configuration with integration/scripts/setup-actions-secrets.sh status."
            if [ -f integration/out/integration-report.md ]; then cat integration/out/integration-report.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the integration report for diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-failure-report
          path: |
            integration/out/integration-report.json
            integration/out/integration-report.md
          if-no-files-found: ignore
