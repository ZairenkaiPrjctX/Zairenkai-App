name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r27d
  NDK_SHA256: 601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9
  RUST_STABLE: "1.97.0"

jobs:
  # REDUCED BUILD. Does not fetch the other repositories, so no native components: zart, zthermal,
  # the module zips and the device asset are absent, and their features report
  # NATIVE_COMPONENT_UNAVAILABLE. Fast feedback only; it is not the integrated app.
  reduced:
    name: reduced build (no native components) - unit and UI tests, lint, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the runner's JDK 17 and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Install Android 16/17 SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon :integration-core:test :app:testDebugUnitTest
      - run: ./gradlew --no-daemon lint assembleDebug -Pzairenkai.allowMissingComponents=true

  scripts:
    name: integration scripts and source lock
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck integration/scripts/*.sh
      - run: python3 -m py_compile integration/scripts/*.py
      - run: python3 -c "import json; [json.load(open(f)) for f in ('integration/organization-repositories.json', 'integration/repository-lock.json', 'integration/system-modules.json', 'integration/module-trust.json')]"
      - run: python3 integration/scripts/verify_integration.py lock
      - run: python3 -m unittest discover -s integration/scripts/tests

  # FULL INTEGRATION BUILD. Every component from its locked commit, the app with native
  # components required (no allowMissingComponents), then the integration report. Every locked
  # repository is public, so the job fetches them anonymously: no token, no secret. A repository
  # that cannot be fetched FAILS the job (it does not skip), because a green reduced build is not
  # evidence that the integrated app builds.
  full-integration:
    name: full integration build (locked sources, native components)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the source lock
        run: python3 integration/scripts/verify_integration.py lock
      # Cache only build checkouts/tool outputs for the exact locked commits. build-components.sh
      # still fetches and verifies every pinned SHA before using the checkout.
      - name: Prepare component cache directory
        run: mkdir -p integration/out/src
      - name: Cache pinned sources and native build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: |
            integration/out/src
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: zairenkai-app-build-${{ runner.os }}-rust-${{ env.RUST_STABLE }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('integration/repository-lock.json', 'integration/system-modules.json', 'integration/module-trust.json', 'integration/scripts/**', 'gradle/**', '*.gradle.kts', 'app/*.gradle.kts', 'integration-core/*.gradle.kts') }}
      - name: Every locked repository can be fetched anonymously
        run: python3 integration/scripts/verify_integration.py access
      - name: Rust, Android targets, NDK (checksum verified) and Ninja (zie-run)
        run: |
          sudo apt-get install -y -q ninja-build
          rustup toolchain install "$RUST_STABLE" --profile minimal -t aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          rustup default "$RUST_STABLE"
          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 1200 -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "${NDK_SHA256}  /tmp/ndk.zip" | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Install Android 16/17 SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - name: Build every component at its locked commit
        run: integration/scripts/build-components.sh
      - name: Verify checkouts, artifacts, notices and module catalog
        run: python3 integration/scripts/verify_integration.py build
      - name: Re-capture contracts from the real binaries (schema compatibility)
        run: integration/scripts/capture-contracts.sh
      - name: Tests, lint and APKs with native components required
        run: ./gradlew --no-daemon :integration-core:test :app:testDebugUnitTest lint assembleDebug assembleRelease
      - name: Inspect the APK and write the integration report
        run: |
          python3 integration/scripts/verify_integration.py apk app/build/outputs/apk/release/app-release-unsigned.apk
          python3 integration/scripts/verify_integration.py report app/build/outputs/apk/release/app-release-unsigned.apk
          cat integration/out/integration-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-build-unsigned-not-for-distribution
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            integration/out/components.json
            integration/out/assets/components.json
            integration/repository-lock.json
            integration/organization-repositories.json
            integration/out/integration-report.json
            integration/out/integration-report.md
          if-no-files-found: error
