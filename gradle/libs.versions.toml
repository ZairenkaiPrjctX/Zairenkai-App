[versions]
agp = "9.4.1"
kotlin = "2.4.10"
coroutines = "1.10.1"
serialization = "1.8.0"
# Stable Compose BOM (UI 1.11.4). Material 3 stays pinned separately to 1.5.0-alpha18 because
# the app uses its expressive APIs; upgrading that UI dependency is a separate UI migration.
compose-bom = "2026.06.01"
# Backdrop blur for the experimental glass bar (Apache-2.0). 1.6.x is the newest line built for
# Compose UI 1.8+ and Kotlin 2.1; 2.x needs Compose 1.12 and Kotlin 2.4.
haze = "1.6.10"
material3-expressive = "1.5.0-alpha18"
activity-compose = "1.10.0"
lifecycle = "2.8.7"
core-ktx = "1.15.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidx-annotation = "1.9.1"
jetbrains-annotations = "26.0.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
# Google Fonts through Google Play services' font provider; the app keeps no network access.
compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3-expressive" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-animation = { module = "androidx.compose.animation:animation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
